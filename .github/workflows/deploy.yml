name: Build and Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/osminogka

jobs:
  build-and-deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GHCR reachability
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Checking ghcr.io connectivity (attempt ${attempt}/5)"
            status_code=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --connect-timeout 10 --max-time 20 https://ghcr.io/v2/ || true)
            if [ "${status_code}" = "200" ] || [ "${status_code}" = "401" ]; then
              echo "GHCR is reachable (HTTP ${status_code})"
              exit 0
            fi
            echo "GHCR check failed (HTTP ${status_code:-none})"
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Failed to reach GHCR after retries"
          nslookup ghcr.io || true
          exit 1

      - name: Log in to GitHub Container Registry with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Docker login to GHCR (attempt ${attempt}/5)"
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              echo "Successfully logged in to GHCR"
              exit 0
            fi
            echo "Docker login failed"
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Could not log in to GHCR after retries"
          docker info || true
          exit 1

      - name: Build and push Authentication service
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Authentication
          file: ./Backend/Authentication/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/authservice:latest

      - name: Build and push Core service
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Core
          file: ./Backend/Core/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/coreservice:latest

      - name: Build and push Courses service
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Courses
          file: ./Backend/Courses/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/coursesservice:latest

      - name: Build and push Forums service
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Forums
          file: ./Backend/Forums/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/forumsservice:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:latest

      - name: Remove legacy UsersService resources
        run: |
          kubectl delete deployment/users-depl --ignore-not-found=true
          kubectl delete service/users-clusterip-srv --ignore-not-found=true
          kubectl delete deployment/mssql-users-depl --ignore-not-found=true
          kubectl delete service/mssql-users-clusterip-srv --ignore-not-found=true
          kubectl delete service/mssql-loadbalancer-users --ignore-not-found=true

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f K8S/
          kubectl rollout restart deployment/auth-depl
          kubectl rollout restart deployment/core-depl
          kubectl rollout restart deployment/courses-depl
          kubectl rollout restart deployment/forums-depl
          kubectl rollout restart deployment/frontend-depl
          kubectl rollout status deployment/auth-depl --timeout=180s
          kubectl rollout status deployment/core-depl --timeout=180s
          kubectl rollout status deployment/courses-depl --timeout=180s
          kubectl rollout status deployment/forums-depl --timeout=180s
          kubectl rollout status deployment/frontend-depl --timeout=180s
